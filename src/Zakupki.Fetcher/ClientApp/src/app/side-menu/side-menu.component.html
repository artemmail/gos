<mat-nav-list aria-label="Навигация по закупкам">
  <a mat-list-item routerLink="/presentation" (click)="close.emit()">
    <mat-icon matListItemIcon>
      help_outline
    </mat-icon>
    <span matListItemTitle>
      О сервисе
    </span>
  </a>
  <ng-container *ngIf="user$ | async; else guestMenu">
    <a mat-list-item routerLink="/tenders" (click)="close.emit()">
      <mat-icon matListItemIcon>
        search
      </mat-icon>
      <span matListItemTitle>
        Поиск закупок
      </span>
    </a>
    <a mat-list-item routerLink="/favorites" (click)="close.emit()">
      <mat-icon matListItemIcon>
        bookmark_border
      </mat-icon>
      <span matListItemTitle>
        Избранное
      </span>
    </a>
    <a mat-list-item routerLink="/company-profile" (click)="close.emit()">
      <mat-icon matListItemIcon>
        business
      </mat-icon>
      <span matListItemTitle>
        Моя компания
      </span>
    </a>
  </ng-container>
  <ng-template #guestMenu>
    <a mat-list-item routerLink="/login" (click)="close.emit()">
      <mat-icon matListItemIcon>
        login
      </mat-icon>
      <span matListItemTitle>
        Войти
      </span>
    </a>
  </ng-template>
</mat-nav-list>
